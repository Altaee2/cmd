<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أوامر CMD الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        terminal: {
                            dark: '#0f172a',
                            card: '#1e293b',
                            green: '#4ade80',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            /* terminal dark */
            color: #f8fafc;
        }
        /* Custom Scrollbar */
        
         ::-webkit-scrollbar {
            width: 8px;
        }
        
         ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        
         ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
         ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-terminal-dark/90 backdrop-blur border-b border-terminal-border shadow-md">
        <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-gray-800 border border-terminal-border flex items-center justify-center text-terminal-green font-mono font-bold text-xl">
                    >_
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white">دليل أوامر موجه الأوامر</h1>
                    <p class="text-sm text-gray-400 font-mono">Windows CMD Reference</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="ابحث عن أمر أو وظيفة (مثال: نسخ، COPY)..." class="w-full bg-terminal-card border border-terminal-border rounded-lg py-2.5 px-4 pr-10 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-terminal-green focus:ring-1 focus:ring-terminal-green transition-colors">
                <svg class="w-5 h-5 absolute left-3 top-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <div id="noResults" class="hidden text-center py-12">
            <div class="text-6xl mb-4">🔍</div>
            <h2 class="text-xl font-bold text-gray-300">لم يتم العثور على نتائج</h2>
            <p class="text-gray-500 mt-2">جرب البحث بكلمات مختلفة أو باسم الأمر باللغة الإنجليزية.</p>
        </div>

        <div id="commandsContainer" class="space-y-12">
            <!-- Content will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-terminal-border bg-terminal-dark py-6 mt-auto">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            تم الإنشاء كمرجع شامل لأوامر CMD. يمكنك حفظ هذه الصفحة (Ctrl+S) للوصول إليها بدون إنترنت.
        </div>
    </footer>

    <!-- JavaScript Data and Render Logic -->
    <script>
        const commandData = [{
            category: "إدارة الملفات والمجلدات",
            icon: "📁",
            commands: [{
                cmd: "CD / CHDIR",
                desc: "التنقل بين المجلدات (عرض المجلد الحالي أو التغيير إليه)."
            }, {
                cmd: "DIR",
                desc: "عرض قائمة الملفات والمجلدات داخل المسار الحالي."
            }, {
                cmd: "MD / MKDIR",
                desc: "إنشاء مجلد جديد."
            }, {
                cmd: "RD / RMDIR",
                desc: "حذف مجلد (يجب أن يكون فارغاً عادةً)."
            }, {
                cmd: "COPY",
                desc: "نسخ ملف أو مجموعة ملفات من مكان لآخر."
            }, {
                cmd: "XCOPY",
                desc: "نسخ مدمج Advanced للملفات والمجلدات بما فيها المجلدات الفرعية."
            }, {
                cmd: "ROBOCOPY",
                desc: "أداة نسخ احترافية ومتقدمة جداً لنقل الملفات والمجلدات الكبيرة مع الحفاظ على الصلاحيات والتوقف والإكمال."
            }, {
                cmd: "MOVE",
                desc: "نقل ملف أو مجلد من مكان إلى آخر، أو إعادة تسميته."
            }, {
                cmd: "DEL / ERASE",
                desc: "حذف ملف أو مجموعة ملفات."
            }, {
                cmd: "REN / RENAME",
                desc: "إعادة تسمية ملف أو مجلد."
            }, {
                cmd: "REPLACE",
                desc: "استبدال ملفات بملفات أخرى تحمل نفس الاسم."
            }, {
                cmd: "TYPE",
                desc: "عرض محتوى ملف نصي مباشرة داخل نافذة الأوامر."
            }, {
                cmd: "TREE",
                desc: "عرض شجرة المجلدات والمسارات بشكل رسومي منظم."
            }, {
                cmd: "COMP",
                desc: "مقارنة محتوى ملفين أو مجموعتين من الملفات وبيان هل هما متطابقان."
            }, {
                cmd: "FC",
                desc: "مقارنة تفصيلية بين ملفين وعرض الفروقات بينهما سطر بسطر (File Compare)."
            }, {
                cmd: "ATTRIB",
                desc: "عرض أو تغيير خصائص الملفات (مثل: إخفاء الملف، جعله للقراءة فقط، أو ملف نظام)."
            }, {
                cmd: "COMPACT",
                desc: "ضغط الملفات والمجلدات أو فك ضغطها على أقراص NTFS لتوفير المساحة."
            }, {
                cmd: "MKLINK",
                desc: "إنشاء روابط رمزية (Symbolic Links) أو روابط صلبة (Hard Links) للملفات والمجلدات."
            }]
        }, {
            category: "إدارة النظام والأقراص",
            icon: "⚙️",
            commands: [{
                cmd: "CHKDSK",
                desc: "فحص القرص الصلب للكشف عن الأخطاء والقطاعات التالفة (Bad Sectors) وإصلاحها."
            }, {
                cmd: "CHKNTFS",
                desc: "ضبط أو عرض عملية فحص القرص التي تتم تلقائياً عند إقلاع الويندوز."
            }, {
                cmd: "DISKPART",
                desc: "أداة متقدمة لإدارة وإعادة تقسيم الأقراص الصلبة والفلاشات."
            }, {
                cmd: "FSUTIL",
                desc: "أداة متقدمة لعرض وتعديل خصائص نظام الملفات (File System)."
            }, {
                cmd: "FORMAT",
                desc: "تهيئة (فورمات) القرص الصلب أو الفلاشة لاستخدامها مع الويندوز."
            }, {
                cmd: "CONVERT",
                desc: "تحويل نظام الملفات من FAT32 إلى NTFS دون فقدان البيانات."
            }, {
                cmd: "LABEL",
                desc: "تسمية القرص أو تغيير اسمه/تعديل ملصق المجلد."
            }, {
                cmd: "VOL",
                desc: "عرض اسم القرص (Label) والرقم التسلسلي الخاص به."
            }, {
                cmd: "RECOVER",
                desc: "استرجاع البيانات القابلة للقراءة من قرص تالف أو به قطاعات معطوبة."
            }, {
                cmd: "SYSTEMINFO",
                desc: "عرض معلومات تفصيلية عن مواصفات الجهاز ونظام التشغيل والذاكرة."
            }, {
                cmd: "DRIVERQUERY",
                desc: "عرض قائمة بكل تعريفات الأجهزة (Drivers) المثبتة وحالتها."
            }, {
                cmd: "SHUTDOWN",
                desc: "إيقاف تشغيل الكمبيوتر أو إعادة تشغيله (محلياً أو عن بُعد)."
            }, {
                cmd: "BCDEDIT",
                desc: "التحكم في قاعدة بيانات الإقلاع وتعديل خيارات إقلاع النظام."
            }]
        }, {
            category: "إدارة المهام والخدمات والحماية",
            icon: "🛡️",
            commands: [{
                cmd: "TASKLIST",
                desc: "عرض جميع البرامج والعمليات (Processes) والخدمات الشغالة حالياً في الخلفية."
            }, {
                cmd: "TASKKILL",
                desc: "إنهاء أو إغلاق برنامج أو عملية شغالة بالقوة عن طريق الاسم أو الـ PID."
            }, {
                cmd: "SC",
                desc: "إدارة خدمات الويندوز (تشغيل، إيقاف، إنشاء، أو تعطيل خدمات الخلفية)."
            }, {
                cmd: "SCHTASKS",
                desc: "جدولة المهام والبرامج لتعمل تلقائياً في وقت محدد."
            }, {
                cmd: "CACLS / ICACLS",
                desc: "عرض أو تعديل صلاحيات الوصول (Permissions) للملفات والمجلدات."
            }, {
                cmd: "OPENFILES",
                desc: "عرض الملفات المفتوحة على الجهاز من قبل مستخدمين آخرين عبر الشبكة."
            }, {
                cmd: "GPRESULT",
                desc: "عرض سياسات المجموعة (Group Policy) المطبقة على الجهاز أو المستخدم."
            }]
        }, {
            category: "أوامر النصوص والبحث والترميز",
            icon: "🔎",
            commands: [{
                cmd: "FIND",
                desc: "البحث عن كلمة أو نص معين داخل ملف نصي."
            }, {
                cmd: "FINDSTR",
                desc: "أداة بحث متقدمة عن النصوص داخل الملفات (تدعم التعبيرات النمطية)."
            }, {
                cmd: "SORT",
                desc: "ترتيب وتنسيق مدخلات النصوص أبجدياً أو رقمياً."
            }, {
                cmd: "MORE",
                desc: "عرض النصوص الطويلة صفحة بصفحة كي لا تتجاوز الشاشة."
            }, {
                cmd: "CHCP",
                desc: "عرض أو تغيير رقم صفحة الترميز (Code Page) لدعم لغات أو محارف مختلفة."
            }, {
                cmd: "GRAFTABL",
                desc: "تفعيل عرض المحارف الممتدة في النمط الرسومي (قديم)."
            }, {
                cmd: "ASSOC",
                desc: "عرض أو تعديل ارتباط امتدادات الملفات (ربط امتداد بنوع معين)."
            }, {
                cmd: "FTYPE",
                desc: "تحديد البرنامج الفعلي الذي يفتح نوع ملف معين مرتبط بـ ASSOC."
            }]
        }, {
            category: "بيئة واجهة الأوامر والتخصيص",
            icon: "🎨",
            commands: [{
                cmd: "CLS",
                desc: "مسح كل ما هو مكتوب على الشاشة وتنظيفها."
            }, {
                cmd: "COLOR",
                desc: "تغيير لون الخط ولون خلفية نافذة الـ CMD."
            }, {
                cmd: "TITLE",
                desc: "تغيير العنوان الظاهر في أعلى شريط نافذة الـ CMD."
            }, {
                cmd: "PROMPT",
                desc: "تغيير شكل سطر الأوامر (مثل تغيير النص الذي يظهر قبل الإدخال)."
            }, {
                cmd: "CMD",
                desc: "فتح نافذة موجه أوامر جديدة مستقلة."
            }, {
                cmd: "EXIT",
                desc: "إغلاق نافذة موجه الأوامر الحالي."
            }, {
                cmd: "HELP",
                desc: "عرض قائمة الأوامر أو شرح مفصل لأمر معين."
            }, {
                cmd: "DOSKEY",
                desc: "حفظ سجل الأوامر السابقة لسهولة استدعائها بالأسهم، وإنشاء اختصارات."
            }, {
                cmd: "MODE",
                desc: "ضبط إعدادات منافذ النظام أو حجم أبعاد نافذة موجه الأوامر."
            }]
        }, {
            category: "السكربتات وملفات الباتش",
            icon: "📜",
            commands: [{
                cmd: "ECHO",
                desc: "طباعة نص على الشاشة، أو تشغيل/إيقاف إظهار تنفيذ الأوامر داخل ملفات الباتش."
            }, {
                cmd: "SET",
                desc: "عرض أو إنشاء أو تعديل متغيرات البيئة (Environment Variables)."
            }, {
                cmd: "SETLOCAL / ENDLOCAL",
                desc: "بدء أو إنهاء حد زمني لمتغيرات البيئة داخل ملف الباتش."
            }, {
                cmd: "PATH",
                desc: "عرض أو تحديد مسارات المجلدات التي يبحث فيها الويندوز عن الملفات التنفيذية."
            }, {
                cmd: "PAUSE",
                desc: "إيقاف تنفيذ السكربت مؤقتاً حتى يضغط المستخدم على أي زر."
            }, {
                cmd: "CALL",
                desc: "استدعاء ملف باتش آخر من داخل ملف الباتش الحالي دون إنهائه."
            }, {
                cmd: "GOTO",
                desc: "الانتقال إلى سطر معين (سطر معنون) داخل السكربت."
            }, {
                cmd: "IF",
                desc: "تنفيذ أمر بشرط معين (التحقق الشرطي في ملفات الباتش)."
            }, {
                cmd: "FOR",
                desc: "التكرار (Loop) لتنفيذ أمر معين على مجموعة ملفات أو قيم."
            }, {
                cmd: "SHIFT",
                desc: "تغيير موقع المعاملات (Parameters) الممررة للسكربت."
            }, {
                cmd: "REM",
                desc: "إضافة تعليق/ملاحظة داخل السكربت لا يتم تنفيذها."
            }, {
                cmd: "BREAK",
                desc: "تفعيل أو تعطيل فحص اختصار إيقاف السكربت CTRL+C."
            }, {
                cmd: "POPD / PUSHD",
                desc: "حفظ المسار الحالي ثم التنقل (PUSHD)، واستعادة المسار المحفوظ (POPD)."
            }, {
                cmd: "START",
                desc: "فتح برنامج أو ملف أو مسار في نافذة جديدة مستقلة."
            }, {
                cmd: "PRINT",
                desc: "إرسال ملف نصي إلى الطابعة لطباعته."
            }, {
                cmd: "SUBST",
                desc: "ربط مسار مجلد بحرف محرك أقراص وهمي."
            }, {
                cmd: "TIME / DATE",
                desc: "عرض أو تعديل الوقت والتاريخ الخاص بالنظام."
            }, {
                cmd: "VER",
                desc: "عرض رقم إصدار نظام الويندوز المثبت."
            }, {
                cmd: "VERIFY",
                desc: "تفعيل أو تعطيل التحقق من كتابة الملفات بشكل صحيح على القرص."
            }, {
                cmd: "WMIC",
                desc: "أداة تفاعلية للحصول على معلومات عن العتاد والنظام."
            }]
        }];

        const container = document.getElementById('commandsContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        // Function to render the commands
        function renderCommands(filterText = "") {
            container.innerHTML = '';
            let totalRendered = 0;

            const lowerFilter = filterText.toLowerCase();

            commandData.forEach(section => {
                // Filter commands in this section
                const filteredCommands = section.commands.filter(c =>
                    c.cmd.toLowerCase().includes(lowerFilter) ||
                    c.desc.toLowerCase().includes(lowerFilter)
                );

                if (filteredCommands.length > 0) {
                    totalRendered += filteredCommands.length;

                    // Create Section Wrapper
                    const sectionEl = document.createElement('section');

                    // Section Title
                    const titleEl = document.createElement('h2');
                    titleEl.className = 'text-2xl font-bold text-white mb-6 flex items-center gap-2 border-b border-terminal-border pb-2';
                    titleEl.innerHTML = `<span class="text-terminal-green">${section.icon}</span> ${section.category}`;
                    sectionEl.appendChild(titleEl);

                    // Commands Grid
                    const gridEl = document.createElement('div');
                    gridEl.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';

                    filteredCommands.forEach(command => {
                        const card = document.createElement('div');
                        card.className = 'bg-terminal-card border border-terminal-border rounded-lg p-5 hover:border-terminal-green hover:shadow-[0_0_15px_rgba(74,222,128,0.1)] transition-all duration-300 group';

                        // Highlight matching text if searching
                        let cmdName = command.cmd;
                        if (filterText && cmdName.toLowerCase().includes(lowerFilter)) {
                            const regex = new RegExp(`(${filterText})`, "gi");
                            cmdName = cmdName.replace(regex, `<span class="bg-terminal-green text-terminal-dark rounded px-1">$1</span>`);
                        }

                        card.innerHTML = `
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="text-xl font-mono font-bold text-terminal-green group-hover:text-white transition-colors">${cmdName}</h3>
                                <button onclick="copyToClipboard('${command.cmd.split('/')[0].trim()}')" class="text-gray-500 hover:text-terminal-green p-1 transition-colors" title="نسخ الأمر">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                </button>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed">${command.desc}</p>
                        `;
                        gridEl.appendChild(card);
                    });

                    sectionEl.appendChild(gridEl);
                    container.appendChild(sectionEl);
                }
            });

            // Toggle No Results Message
            if (totalRendered === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // Initialize Rendering
        renderCommands();

        // Search Event Listener
        searchInput.addEventListener('input', (e) => {
            renderCommands(e.target.value);
        });

        // Copy to clipboard function
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Flash effect for the input or body could be added here, 
                // but a simple silent copy is usually fine for these references.
            }).catch(err => {
                // Fallback for older browsers / iframe restrictions
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            });
        }
    </script>
</body>

</html>
